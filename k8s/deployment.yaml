apiVersion: apps/v1
kind: Deployment
metadata:
  name: meditrack-deployment
  namespace: healthcare
spec:
  replicas: 2
  selector:
    matchLabels:
      app: meditrack
  template:
    metadata:
      labels:
        app: meditrack
    spec:
      containers:
      - name: meditrack
        image: DOCKER_USER/meditrack:IMAGE_TAG
        ports:
        - containerPort: 3000
        env:
        - name: APP_VERSION
          value: "v1.0.0"
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: meditrack-service
  namespace: healthcare
spec:
  selector:
    app: meditrack
  ports:
  - port: 80
    targetPort: 3000
