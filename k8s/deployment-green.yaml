apiVersion: apps/v1
kind: Deployment
metadata:
  name: meditrack-green
  namespace: healthcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meditrack
      version: green
  template:
    metadata:
      labels:
        app: meditrack
        version: green
    spec:
      containers:
      - name: meditrack
        image: yashraj0409/meditrack:latest
        ports:
        - containerPort: 3000
        env:
        - name: APP_VERSION
          value: "v2.0.0-GREEN"
        - name: DEPLOYMENT_SLOT
          value: "GREEN"
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
